<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>קטלוג המשתלה</title>
<meta name="theme-color" content="#2E6B3C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="המשתלה">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
#authGate{position:fixed;inset:0;z-index:500;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
.auth-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px 24px;width:min(400px,100%);display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.auth-card h1{color:var(--leaf);font-size:1.6rem}
.auth-card form{width:100%;text-align:right}
.auth-note{background:var(--clay-soft);border-radius:10px;padding:8px 12px;margin:0}
#authBody{width:100%}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Suez+One&display=swap">
<style>
/* Layout: nursery-label cards on a leaf-paper ground; sticky header with search, tabs as a bottom bar on phones */
:root{
  --bg:#EEF2EC; --surface:#FFFFFF; --surface-2:#E3EADF; --line:#C9D4C4;
  --ink:#16241A; --ink-2:#4A5A4E; --leaf:#2E6B3C; --leaf-ink:#FFFFFF; --leaf-soft:#D6E7D3;
  --clay:#9A4E1F; --clay-soft:#F4E2D4; --danger:#B3261E; --focus:#1F5FD1;
  --f-display:"Suez One","Assistant",Georgia,serif;
  --f-body:"Assistant","Segoe UI",Arial,sans-serif;
  --r:12px; --fs:17px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121915; --surface:#1B241E; --surface-2:#243029; --line:#33433A;
  --ink:#E8EFE9; --ink-2:#A9B8AD; --leaf:#7DC48B; --leaf-ink:#0E1A11; --leaf-soft:#22392A;
  --clay:#E7A273; --clay-soft:#3A2A1F; --danger:#FF8A80; --focus:#8AB4FF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121915; --surface:#1B241E; --surface-2:#243029; --line:#33433A;
  --ink:#E8EFE9; --ink-2:#A9B8AD; --leaf:#7DC48B; --leaf-ink:#0E1A11; --leaf-soft:#22392A;
  --clay:#E7A273; --clay-soft:#3A2A1F; --danger:#FF8A80; --focus:#8AB4FF; color-scheme:dark}
:root[data-contrast="high"]{--ink-2:var(--ink); --line:var(--ink)}
:root[data-size="l"]{--fs:19px} :root[data-size="xl"]{--fs:22px}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:var(--fs);line-height:1.55;direction:rtl}
h1,h2,h3{font-family:var(--f-display);font-weight:400;line-height:1.2;text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.skip{position:absolute;inset-inline-start:16px;top:8px;background:var(--leaf);color:var(--leaf-ink);padding:8px 14px;border-radius:8px;z-index:50;transform:translateY(-300%)}
.skip:focus{transform:none}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1280px;margin:0 auto}

/* header */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-inline-end:auto}
.brand svg{width:34px;height:34px;flex:none}
.brand h1{font-size:1.45rem;color:var(--leaf)}
nav.tabs{display:flex;gap:4px}
.tab{border:0;background:none;padding:10px 14px;border-radius:999px;font-weight:700;cursor:pointer;min-height:44px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.tab svg{width:20px;height:20px}
.tab[aria-current="page"]{background:var(--leaf-soft);color:var(--ink)}
.tab:hover{color:var(--ink)}
.a11y{display:flex;gap:4px}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-width:44px;min-height:44px;cursor:pointer;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 10px}
.icon-btn[aria-pressed="true"]{background:var(--leaf);color:var(--leaf-ink);border-color:var(--leaf)}

@media (max-width:760px){
  nav.tabs{position:fixed;inset:auto 0 0 0;background:var(--surface);border-top:1px solid var(--line);justify-content:space-around;z-index:20;
    padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .tab{flex-direction:column;gap:2px;font-size:.78rem;padding:6px 8px;border-radius:10px}
  main{padding-bottom:90px}
  .brand h1{font-size:1.2rem}
}

main{padding-block:20px 40px}
.view[hidden]{display:none}

/* buttons & inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--leaf);border-color:var(--leaf);color:var(--leaf-ink)}
.btn.clay{background:var(--clay-soft);border-color:transparent;color:var(--clay)}
.btn.danger{color:var(--danger);border-color:currentColor;background:transparent}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{min-height:36px;padding:4px 12px;font-size:.9em}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:18px;height:18px;flex:none}
label{font-weight:700;font-size:.92em}
.inp, select.inp, textarea.inp{width:100%;min-height:44px;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px}
.inp:focus{border-color:var(--leaf)}
textarea.inp{min-height:90px;resize:vertical}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.hint{color:var(--ink-2);font-size:.88em}
.muted{color:var(--ink-2)}

/* search */
.search-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch}
.search-box{flex:1 1 320px;position:relative;min-width:0}
.search-box svg{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);width:22px;height:22px;color:var(--ink-2);pointer-events:none}
.search-box input{width:100%;min-height:54px;border-radius:14px;border:2px solid var(--line);background:var(--surface);padding:8px 48px 8px 14px;font-size:1.1em}
.search-box input:focus{border-color:var(--leaf);outline:none;box-shadow:0 0 0 3px var(--leaf-soft)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;min-height:40px;cursor:pointer;font-weight:700;display:inline-flex;align-items:center;gap:8px}
.chip .dot{width:12px;height:12px;border-radius:50%;flex:none}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{font-weight:400;opacity:.75;font-variant-numeric:tabular-nums}
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-block:16px 12px}
.toolbar .count{margin-inline-end:auto;font-weight:700}
details.filters{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-top:12px}
details.filters summary{cursor:pointer;padding:12px 16px;font-weight:700;min-height:44px}
.filter-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;padding:0 16px 16px}

.smart-box{margin-top:14px;background:var(--leaf-soft);border-radius:var(--r);padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.smart-box p{margin:0;flex:1;min-width:0}
.client-banner{margin-top:14px;background:var(--clay-soft);color:var(--ink);border-radius:var(--r);padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.client-banner b{color:var(--clay)}

/* plant cards: nursery labels */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.card .open{all:unset;cursor:pointer;display:flex;flex-direction:column;flex:1}
.card .open:focus-visible{outline:3px solid var(--focus);outline-offset:-3px}
.thumb{aspect-ratio:4/3;max-width:100%;background:var(--surface-2);position:relative;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-size:3.2rem;color:#fff}
.ph svg{position:absolute;inset:auto 10px 10px auto;width:40px;height:40px;opacity:.45}
.imgcount{position:absolute;bottom:8px;inset-inline-start:8px;background:rgba(0,0,0,.6);color:#fff;border-radius:999px;padding:0 10px;font-size:.8rem;font-weight:700}
.tag{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1;position:relative}
.tag::before{content:"";position:absolute;top:-7px;inset-inline-start:50%;width:14px;height:14px;background:var(--surface);border-radius:50%;border:1px solid var(--line);transform:translateX(50%)}
.tag h3{font-size:1.2rem}
.latin{font-style:italic;color:var(--ink-2);font-size:.92em;direction:ltr;text-align:right}
.cats{display:flex;gap:6px;flex-wrap:wrap}
.cat{font-size:.78rem;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--surface-2);display:inline-flex;align-items:center;gap:6px}
.cat .dot{width:8px;height:8px;border-radius:50%}
.facts{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.88em;color:var(--ink-2)}
.price-from{margin-top:auto;padding-top:6px;font-weight:800;color:var(--clay);font-variant-numeric:tabular-nums}
.example{position:absolute;top:8px;inset-inline-end:8px;background:var(--surface);color:var(--ink-2);font-size:.72rem;font-weight:700;border-radius:6px;padding:1px 8px;border:1px dashed var(--line)}
.quick-add{position:absolute;top:8px;inset-inline-start:8px;z-index:2}

.empty{background:var(--surface);border:2px dashed var(--line);border-radius:16px;padding:40px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty svg{width:60px;height:60px;color:var(--leaf)}

/* dialogs */
dialog{border:0;border-radius:18px;padding:0;background:var(--surface);color:var(--ink);width:min(920px,calc(100vw - 24px));max-height:calc(100dvh - 24px);direction:rtl}
dialog::backdrop{background:rgba(10,20,12,.55)}
.dlg-head{position:sticky;top:0;background:var(--surface);display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);z-index:2}
.dlg-head h2{font-size:1.4rem;margin-inline-end:auto;min-width:0}
.dlg-body{padding:20px;display:flex;flex-direction:column;gap:20px}
.dlg-foot{position:sticky;bottom:0;background:var(--surface);display:flex;gap:10px;justify-content:flex-start;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.two{display:grid;grid-template-columns:1.1fr 1fr;gap:24px}
@media (max-width:760px){.two{grid-template-columns:1fr}}
.gallery-main{aspect-ratio:4/3;max-width:100%;background:var(--surface-2);border-radius:14px;overflow:hidden;position:relative}
.gallery-main img{width:100%;height:100%;object-fit:contain;background:#0b0f0c}
.gal-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.55);color:#fff;border:0;width:44px;height:44px;border-radius:50%;cursor:pointer;font-size:1.4rem}
.gal-nav.prev{inset-inline-start:8px}.gal-nav.next{inset-inline-end:8px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumbs button{all:unset;cursor:pointer;width:64px;height:64px;border-radius:8px;overflow:hidden;border:3px solid transparent}
.thumbs button[aria-current="true"]{border-color:var(--leaf)}
.thumbs button:focus-visible{outline:3px solid var(--focus)}
.thumbs img{width:100%;height:100%;object-fit:cover}
dl.attrs{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0}
dl.attrs dt{font-weight:700;color:var(--ink-2)}
dl.attrs dd{margin:0}
.section-title{font-family:var(--f-body);font-weight:800;font-size:.85rem;letter-spacing:.04em;color:var(--ink-2);margin-bottom:8px}
table.t{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.t th,table.t td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle}
table.t th{font-size:.85rem;color:var(--ink-2);font-weight:800}
.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.links{display:flex;gap:8px;flex-wrap:wrap}

/* editor images */
.img-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.img-item{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface-2)}
.img-item img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.img-item .row{display:flex;gap:4px;padding:4px;flex-wrap:wrap}
.img-item .cover{font-size:.75rem;font-weight:800;color:var(--leaf);padding:2px 6px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.drop.over{border-color:var(--leaf);background:var(--leaf-soft)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.checks{display:flex;gap:8px;flex-wrap:wrap}
.checks label{font-weight:600;display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;min-height:40px}
.checks input{width:18px;height:18px;accent-color:var(--leaf)}
.checks label:has(input:checked){background:var(--leaf-soft);border-color:var(--leaf)}
fieldset{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:0;min-width:0}
legend{font-weight:800;padding:0 6px}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.page-head{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:18px}
.page-head h2{font-size:1.8rem;margin-inline-end:auto}
.stack{display:flex;flex-direction:column;gap:18px}
.list-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:0}
.list-row .inp{flex:1 1 180px;width:auto}
.swatches{display:flex;gap:4px}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--surface)}
.matrix input{width:96px;min-height:40px;text-align:left;direction:ltr}
.matrix td:first-child{font-weight:700;white-space:nowrap}

/* clients */
.clients{display:grid;grid-template-columns:280px 1fr;gap:18px;align-items:start}
.clients>*{min-width:0}
@media (max-width:860px){.clients{grid-template-columns:1fr}}
.client-list{display:flex;flex-direction:column;gap:8px}
.client-item{all:unset;cursor:pointer;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column}
.client-item[aria-current="true"]{border-color:var(--leaf);background:var(--leaf-soft)}
.client-item:focus-visible{outline:3px solid var(--focus)}
.client-item small{color:var(--ink-2)}
.qty{display:inline-flex;align-items:center;gap:4px}
.qty input{width:60px;text-align:center;min-height:36px}
.total{font-size:1.3rem;font-weight:800;color:var(--clay);font-variant-numeric:tabular-nums}
.mini{width:52px;height:52px;border-radius:8px;object-fit:cover;background:var(--surface-2);display:block}

/* present mode */
.present{position:fixed;inset:0;background:var(--bg);z-index:100;overflow:auto;padding-top:env(safe-area-inset-top,0px)}
.present .grid{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.present-head{display:flex;gap:12px;align-items:center;padding-block:20px;flex-wrap:wrap}
.present-head h2{font-size:2rem;margin-inline-end:auto}

.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));inset-inline-start:50%;transform:translateX(50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:700;z-index:200;max-width:calc(100vw - 32px)}
@media (max-width:760px){.toast{bottom:calc(96px + env(safe-area-inset-bottom,0px))}}
.spin{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.area-head td{background:var(--surface-2);font-weight:800}
.area-chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.area-chip{display:inline-flex;align-items:center;gap:4px;background:var(--surface-2);border-radius:999px;padding:2px 4px 2px 12px;font-weight:700}
.area-chip button{all:unset;cursor:pointer;width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center}
.area-chip button:focus-visible{outline:3px solid var(--focus)}
.calc{font-size:.8em;color:var(--ink-2);display:block;margin-top:2px;font-variant-numeric:tabular-nums}
.id-photo{max-width:100%;max-height:340px;border-radius:12px;display:block;object-fit:contain;background:var(--surface-2)}
.match{display:flex;gap:10px;align-items:center}
[hidden]{display:none!important}
.ai-filled{outline:2px dashed var(--clay);outline-offset:2px}
label.ai-filled{background:var(--clay-soft)!important}
.season{font-size:.8rem;font-weight:700;color:var(--ink-2);background:var(--surface-2);border-radius:6px;padding:2px 8px;align-self:flex-start}
.season.on{background:var(--leaf-soft);color:var(--ink)}
.viewer{width:100vw;height:100dvh;max-width:none;max-height:none;margin:0;border-radius:0;background:#0b0f0c;color:#fff;padding:0;overflow:hidden}
.viewer::backdrop{background:#000}
.vw-top{position:absolute;inset:0 0 auto 0;display:flex;gap:8px;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));background:linear-gradient(rgba(0,0,0,.7),transparent);z-index:2}
.vw-title{margin-inline-end:auto;font-weight:700}
.vw-btn{width:48px;height:48px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:1.4rem;font-weight:800;cursor:pointer}
.vw-btn:focus-visible,.vw-nav:focus-visible{outline:3px solid #8AB4FF}
.vw-stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;touch-action:none;overflow:hidden}
.vw-img{max-width:100%;max-height:100%;object-fit:contain;transform-origin:center;user-select:none;-webkit-user-drag:none}
.vw-nav{position:absolute;top:50%;transform:translateY(-50%);width:56px;height:56px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:1.8rem;cursor:pointer;z-index:2}
.vw-nav.prev{inset-inline-start:max(12px,env(safe-area-inset-right,0px))}.vw-nav.next{inset-inline-end:max(12px,env(safe-area-inset-left,0px))}
.vw-hint{position:absolute;bottom:calc(10px + env(safe-area-inset-bottom,0px));inset-inline:0;text-align:center;font-size:.8rem;opacity:.7;margin:0}
.gallery-main .zoom-btn,.slide-img .zoom-tag{position:absolute;bottom:8px;inset-inline-end:8px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:999px;padding:6px 12px;font-weight:700;font-size:.85rem}
.gallery-main img{cursor:zoom-in}
#acList{position:absolute;top:calc(100% + 4px);inset-inline:0;z-index:30;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;list-style:none;margin:0;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.15)}
#acList li{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;cursor:pointer;min-height:48px}
#acList li[aria-selected="true"],#acList li:hover{background:var(--leaf-soft)}
#acList img,.ac-dot{width:40px;height:40px;border-radius:8px;object-fit:cover;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--f-display)}
#acList i{display:block;color:var(--ink-2);font-size:.85em;text-align:right}
.slides{display:flex;flex-direction:column}
.slide-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-block:12px}
.slide-count{margin-inline-end:auto;font-weight:800;font-size:1.1rem}
.slide-body{flex:1;display:grid;grid-template-columns:1.3fr 1fr;gap:28px;align-items:start;padding-block:8px 20px;width:100%}
@media (max-width:760px){.slide-body{grid-template-columns:1fr;gap:16px}}
.slide-img{all:unset;display:block;position:relative;width:100%;aspect-ratio:4/3;max-width:100%;border-radius:16px;overflow:hidden;background:var(--surface-2);cursor:zoom-in}
.slide-img:focus-visible{outline:3px solid var(--focus)}
.slide-img img{width:100%;height:100%;object-fit:cover;display:block}
.slide-info{display:flex;flex-direction:column;gap:10px;min-width:0}
.slide-info .cat{align-self:flex-start;font-size:.9rem}
.slide-name{font-size:clamp(1.8rem,4vw,2.8rem)}
.slide-var{font-size:1.1rem}
.slide-qty{font-size:1.2rem;color:var(--clay);font-weight:700}
.slide-foot{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px))}
.slide-nav{min-height:52px;flex:none}
.slide-strip{flex:1;display:flex;gap:6px;overflow-x:auto;min-width:0;padding:2px}
.slide-strip button{all:unset;cursor:pointer;flex:none;width:52px;height:52px;border-radius:8px;overflow:hidden;border:3px solid transparent;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-weight:800}
.slide-strip button[aria-current="true"]{border-color:var(--leaf)}
.slide-strip button:focus-visible{outline:3px solid var(--focus)}
.slide-strip img{width:100%;height:100%;object-fit:cover}
.var-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.var-row .inp{flex:1 1 160px;width:auto}
.letters{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px}
.letters button{min-width:40px;min-height:40px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);font-weight:800;cursor:pointer;font-size:1rem}
.letters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.used{font-size:.8rem;color:var(--ink-2);font-weight:700}
.slide-edit{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.swap-panel{border:1.5px solid var(--leaf);border-radius:14px;padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:10px}
.swap-list{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.swap-list button{all:unset;cursor:pointer;flex:none;width:130px;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.swap-list button:focus-visible{outline:3px solid var(--focus)}
.swap-list .thumb{aspect-ratio:1}
.swap-list b{display:block;padding:6px 8px;font-size:.9rem}
.swap-list small{display:block;padding:0 8px 8px;color:var(--ink-2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<a class="skip" href="#main">דילוג לתוכן</a>
<header class="top">
  <div class="wrap top-row">
    <div class="brand">
      <img id="bizLogo" alt="" hidden style="width:40px;height:40px;object-fit:contain;border-radius:8px"><svg id="brandLeaf" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 36V18" stroke="var(--leaf)" stroke-width="3" stroke-linecap="round"/><path d="M20 22c-9 0-13-6-13-14 9 0 13 5 13 14z" fill="var(--leaf)"/><path d="M20 18c0-7 4-12 13-12 0 8-4 12-13 12z" fill="var(--leaf)" opacity=".6"/><path d="M11 30h18l-2 7H13z" fill="var(--clay)"/></svg>
      <div style="display:flex;flex-direction:column;line-height:1.1"><h1 id="bizName">קטלוג המשתלה</h1><span class="hint" id="bizSub" hidden>קטלוג צמחים</span></div>
    </div>
    <nav class="tabs" aria-label="ניווט ראשי">
      <button class="tab" data-view="catalog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 21V11M12 13c-5 0-7-3-7-8 5 0 7 3 7 8zM12 11c0-4 2-7 7-7 0 5-2 7-7 7z"/></svg>צמחים</button>
      <button class="tab" data-view="clients"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 4h6v3H9zM6 6h12v15H6z"/><path d="M9 12h6M9 16h4"/></svg>לקוחות</button>
      <button class="tab" data-view="prices"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.5"/></svg>מחירון</button>
      <button class="tab" data-view="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>הגדרות</button>
    </nav>
    <div class="a11y" role="group" aria-label="נגישות">
      <button class="icon-btn" id="sizeBtn" title="גודל טקסט" aria-label="הגדלת טקסט">א<span style="font-size:.7em">+</span></button>
      <button class="icon-btn" id="contrastBtn" aria-pressed="false" title="ניגודיות גבוהה" aria-label="ניגודיות גבוהה"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg></button>
    </div>
  </div>
</header>

<main id="main" class="wrap" tabindex="-1">
  <!-- CATALOG -->
  <section class="view" id="view-catalog" aria-labelledby="h-cat">
    <h2 id="h-cat" class="sr">קטלוג צמחים</h2>
    <form class="search-bar" id="searchForm" role="search">
      <div class="search-box">
        <label for="q" class="sr">חיפוש צמח</label>
        <input id="q" type="search" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="acList" placeholder="חיפוש: שם, שם לטיני, זן, צבע פריחה…">
        <ul id="acList" role="listbox" aria-label="הצעות" hidden></ul>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      </div>
      <button type="button" class="btn" id="smartBtn" title="חיפוש בשפה חופשית, למשל: עץ פורח צהוב לשמש מלאה שלא גדל מעל 4 מטר"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l1.8 5.2L19 9l-5.2 1.8L12 16l-1.8-5.2L5 9l5.2-1.8zM19 14l.9 2.6 2.6.9-2.6.9L19 21l-.9-2.6-2.6-.9 2.6-.9z"/></svg>חיפוש חכם</button>
      <button type="button" class="btn" id="photoBtn" hidden title="צלמו או בחרו תמונה של צמח, ו־Claude יזהה אותו"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>זיהוי מתמונה</button>
      <input type="file" id="photoIn" accept="image/*" capture="environment" class="sr" tabindex="-1" aria-hidden="true">
      <button type="button" class="btn" id="bulkBtn" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>הוספת רשימה</button>
      <button type="button" class="btn primary" id="addPlantBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>צמח חדש</button>
    </form>
    <div id="smartOut"></div>
    <div id="clientBanner"></div>
    <div class="chips" id="catChips" role="group" aria-label="סינון לפי קטגוריה"></div>
    <details class="filters" id="filtersBox"><summary>סינון לפי מאפיינים</summary><div class="filter-grid" id="filterGrid"></div></details>
    <div class="toolbar">
      <span class="count" id="count" aria-live="polite"></span>
      <label for="sort" class="muted">מיון</label>
      <select id="sort" class="inp" style="width:auto">
        <option value="name">לפי שם</option>
        <option value="priceAsc">מחיר: מהזול</option>
        <option value="priceDesc">מחיר: מהיקר</option>
        <option value="new">נוספו לאחרונה</option>
      </select>
    </div>
    <div id="letters" class="letters" role="group" aria-label="סינון לפי אות"></div>
    <div id="results"></div>
  </section>

  <!-- CLIENTS -->
  <section class="view" id="view-clients" hidden aria-labelledby="h-cl"></section>
  <!-- PRICES -->
  <section class="view" id="view-prices" hidden aria-labelledby="h-pr"></section>
  <!-- SETTINGS -->
  <section class="view" id="view-settings" hidden aria-labelledby="h-st"></section>
</main>

<dialog id="dlg" aria-labelledby="dlgTitle"></dialog>
<dialog id="viewer" class="viewer" aria-label="צפייה בתמונה"></dialog>
<dialog id="confirmDlg" aria-labelledby="cfTitle" style="width:min(460px,calc(100vw - 24px))"></dialog>
<div id="presentRoot"></div>
<div id="toast" class="toast" role="status" hidden></div>

<script src="config.js"></script>
<script src="firebase-app-compat.js"></script>
<script src="firebase-auth-compat.js"></script>
<script src="firebase-firestore-compat.js"></script>
<script src="fb-adapter.js"></script>
<script>
(() => {
'use strict';
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
             set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const ILS = n => (n == null || n === '' || isNaN(n)) ? '' : '₪' + Number(n).toLocaleString('he-IL', {maximumFractionDigits: 2});
const num = v => (v == null || v === '' || isNaN(v)) ? null : Number(v);
const byOrder = (a, b) => (a.order ?? 999) - (b.order ?? 999) || String(a.name || a.label).localeCompare(String(b.name || b.label), 'he');
const blob = id => (window.assetUrl ? window.assetUrl(id) : '/_blob/' + id);
const COLORS = ['#2E6B3C','#C2410C','#B4237A','#7C3AED','#0E7490','#A16207','#4D7C0F','#BE123C','#1D4ED8','#57534E'];
const NO_AREA = 'כללי';
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3000); }

const FIN = {'ך':'כ','ם':'מ','ן':'נ','ף':'פ','ץ':'צ'};
/* light Hebrew stemming: סגולה→סגול, פרחים→פרח, והצהוב→צהוב */
function stems(t) {
  const out = new Set([t]);
  let x = t;
  if (x.length >= 4 && /^[והבלמשכ]/.test(x)) { x = x.slice(1); out.add(x); if (x.length >= 4 && /^[הבלמ]/.test(x)) out.add(x.slice(1)); }
  [...out].forEach(y => { const m = y.match(/^(.{2,}?)(ות|ים|יות|ה|ת|י)$/); if (m && m[1].length >= 2) out.add(m[1]); });
  return [...out];
}
const tokOk = (h, t) => stems(t).some(x => h.includes(x));
const norm = s => String(s ?? '').toLowerCase().replace(/[֑-ׇ]/g, '').replace(/[ךםןףץ]/g, c => FIN[c]).replace(/[׳'"״`.,;:!?()\-_/]/g, ' ').replace(/\s+/g, ' ').trim();
function lev1(a, b) {
  if (a === b) return true; const la = a.length, lb = b.length; if (Math.abs(la - lb) > 1) return false;
  let i = 0, j = 0, e = 0;
  while (i < la && j < lb) { if (a[i] === b[j]) { i++; j++; continue; } if (++e > 1) return false;
    if (la > lb) i++; else if (lb > la) j++; else { i++; j++; } }
  return e + (la - i) + (lb - j) <= 1;
}

/* ---------- state ---------- */
const S = { categories: [], fields: [], sizes: [], pricing: {}, plantPricing: [], plants: [], clients: [], biz: {}, ready: {}, noDb: false };
const UI = { clientOrder: ls.get('clientOrder', 'time'), slide: 0, slideImg: 0, overview: false, view: 'catalog', q: '', cat: 'all', filters: {}, sort: 'name', smart: null, activeClient: ls.get('activeClient', null), lastArea: ls.get('lastArea', ''), present: false, showPrices: true };
let db = null, assets = null, sample = null, user = null, downloads = null, canWrite = false, imgLimits = null;

/* ---------- accessibility prefs ---------- */
const sizes3 = ['m', 'l', 'xl'];
const SIZE_NAMES = {m: 'רגיל', l: 'גדול', xl: 'גדול מאוד'};
let pref = ls.get('a11y', {size: 'm', contrast: false});
function applyPref() {
  document.documentElement.dataset.size = pref.size;
  document.documentElement.dataset.contrast = pref.contrast ? 'high' : '';
  $('#contrastBtn').setAttribute('aria-pressed', String(!!pref.contrast));
  $('#sizeBtn').setAttribute('aria-label', 'גודל טקסט: ' + SIZE_NAMES[pref.size] + '. לחצו להחלפה');
  ls.set('a11y', pref);
}
$('#sizeBtn').onclick = () => { pref.size = sizes3[(sizes3.indexOf(pref.size) + 1) % 3]; applyPref(); toast('גודל טקסט: ' + SIZE_NAMES[pref.size]); };
$('#contrastBtn').onclick = () => { pref.contrast = !pref.contrast; applyPref(); };
applyPref();

/* ---------- views / nav ---------- */
const VIEWS = ['catalog', 'clients', 'prices', 'settings'];
const ADMIN_VIEWS = ['clients', 'prices'];
function show(v) {
  if (!VIEWS.includes(v) || (ADMIN_VIEWS.includes(v) && !canWrite)) v = 'catalog';
  UI.view = v;
  VIEWS.forEach(x => { $('#view-' + x).hidden = x !== v; });
  $$('.tab').forEach(t => { t.removeAttribute('aria-current'); if (t.dataset.view === v) t.setAttribute('aria-current', 'page'); t.hidden = ADMIN_VIEWS.includes(t.dataset.view) && !canWrite; });
  try { history.replaceState(null, '', '#' + v); } catch {}
  renderView(true);
}
$$('.tab').forEach(t => t.onclick = () => show(t.dataset.view));

/* ---------- pricing ---------- */
const plantById = id => S.plants.find(p => p.id === id);
const catById = id => S.categories.find(c => c.id === id);
const sizeById = id => S.sizes.find(s => s.id === id);
const pp = id => S.plantPricing.find(x => x.id === id) || {};
function roundPrice(v) { const r = Number(S.pricing.rounding) || 1; return Math.round(v / r) * r; }
function catCost(catIds, sizeId) { for (const c of (catIds || [])) { const v = num(S.pricing.cost && S.pricing.cost[c] && S.pricing.cost[c][sizeId]); if (v != null) return v; } return null; }
function markupFor(catIds, own) {
  if (num(own) != null) return num(own);
  for (const c of (catIds || [])) { const v = num(S.pricing.markup && S.pricing.markup[c]); if (v != null) return v; }
  return num(S.pricing.defaultMarkup) ?? 0;
}
/* full price breakdown for a plant (optionally with unsaved editor values) */
function priceInfo(p, sizeId, pr = pp(p.id)) {
  const sale = num(pr.sale && pr.sale[sizeId]);
  const ownCost = num(pr.cost && pr.cost[sizeId]);
  const cost = ownCost ?? catCost(p.categoryIds, sizeId);
  const m = markupFor(p.categoryIds, pr.markup);
  const price = sale ?? (cost != null ? roundPrice(cost * (1 + m / 100)) : null);
  return {price, cost, ownCost, sale, markup: m};
}
const priceOf = (p, sizeId) => priceInfo(p, sizeId).price;
function sizesFor(p) {
  const limited = p.sizeIds && p.sizeIds.length;
  const list = limited ? p.sizeIds.map(sizeById).filter(Boolean) : S.sizes;
  return list.slice().sort(byOrder).map(s => ({size: s, price: priceOf(p, s.id)})).filter(x => limited || x.price != null);
}
const showCatPrices = () => canWrite && !!(S.pricing && S.pricing.showCatalogPrices);
function minPrice(p) { const v = sizesFor(p).map(x => x.price).filter(x => x != null); return v.length ? Math.min(...v) : null; }
function fmtVal(f, v) {
  if (v == null || v === '' || (Array.isArray(v) && !v.length)) return '';
  if (f.type === 'bool') return v ? 'כן' : 'לא';
  if (Array.isArray(v)) return v.join(', ');
  return v + (f.unit ? ' ' + f.unit : '');
}

/* write queue: one write at a time per document */
const qmap = new Map();
function w(path, fn) {
  const prev = qmap.get(path) || Promise.resolve();
  const next = prev.then(() => fn(db.doc(path)));
  qmap.set(path, next.catch(() => {}));
  return next.catch(e => { handleWriteErr(e); throw e; });
}
const wq = (path, fn) => w(path, fn).catch(() => {});
function handleWriteErr(e) {
  console.warn(e);
  if (e && e.code === 'invalid_argument') toast('אין הרשאה לשמור שינויים בתצוגה זו');
  else if (e && e.code === 'quota_exceeded') toast('האחסון מלא. מחקו פריטים ישנים ונסו שוב');
  else toast('השמירה נכשלה. נסו שוב בעוד רגע');
}
/* create-or-merge for settings docs */
const upsert = (path, patch) => wq(path, async r => { const s = await r.get(); return s.exists ? r.update(patch) : r.set(patch); });

/* ---------- render scheduling ---------- */
let rq = false;
function scheduleRender() { if (rq) return; rq = true; requestAnimationFrame(() => { rq = false; renderView(false); }); }
function renderView(force) {
  renderBrand(); renderCatalogChrome(); renderResults();
  if (UI.present) renderPresent();
  const v = UI.view; if (v === 'catalog') return;
  const host = $('#view-' + v);
  if (!force && host.contains(document.activeElement) && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { host.dataset.dirty = '1'; return; }
  host.dataset.dirty = '';
  ({clients: renderClients, prices: renderPrices, settings: renderSettings})[v](host);
}
document.addEventListener('focusout', () => {
  setTimeout(() => { const host = $('#view-' + UI.view); if (host && host.dataset.dirty === '1' && !host.contains(document.activeElement)) renderView(true); }, 50);
});
function renderBrand() {
  const n = (S.biz.name || '').trim();
  $('#bizName').textContent = n || 'קטלוג המשתלה';
  $('#bizSub').hidden = !n;
  const lg = $('#bizLogo');
  if (S.biz.logoId) { if (lg.getAttribute('src') !== blob(S.biz.logoId)) lg.src = blob(S.biz.logoId); lg.hidden = false; $('#brandLeaf').style.display = 'none'; }
  else { lg.hidden = true; $('#brandLeaf').style.display = ''; }
}

/* ---------- catalog ---------- */
const PH_LEAF = '<svg viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M5 21c0-9 6-15 16-16-1 10-7 16-16 16zm0 0l8-8"/></svg>';
function placeholder(p) {
  const c = catById((p.categoryIds || [])[0]);
  return `<div class="ph" style="background:${esc(c ? c.color : '#5b7a62')}"><span aria-hidden="true">${esc((p.name || '?').trim()[0] || '?')}</span>${PH_LEAF}</div>`;
}
function catPills(p) {
  return (p.categoryIds || []).map(catById).filter(Boolean).map(c => `<span class="cat"><span class="dot" style="background:${esc(c.color)}"></span>${esc(c.name)}</span>`).join('');
}
function keyFacts(p) {
  return S.fields.filter(f => f.card).slice(0, 3).map(f => { const v = fmtVal(f, p.attrs && p.attrs[f.id]); return v ? `<span><b>${esc(f.label)}:</b> ${esc(v)}</span>` : ''; }).join('');
}
function haystack(p) {
  const parts = [p.name, p.latin, p.otherNames, p.notes, ...(p.varieties || []).flatMap(v => [v.name, v.desc])];
  if (canWrite) parts.push(pp(p.id).supplier);
  (p.categoryIds || []).forEach(id => { const c = catById(id); if (c) parts.push(c.name); });
  S.fields.forEach(f => { const v = p.attrs && p.attrs[f.id]; if (v == null || v === '') return;
    if (f.type === 'bool') { if (v) parts.push(f.label); } else parts.push(f.label + ' ' + (Array.isArray(v) ? v.join(' ') : String(v))); });
  return norm(parts.join(' '));
}
const firstLetter = n => { const t = norm(n).replace(/[^\u05D0-\u05EAa-z]/g, ''); return t ? t[0] : ''; };
function usageCount(id) { const set = new Set(); S.clients.forEach(c => (c.items || []).forEach(it => { if (it.plantId === id) set.add(c.id); })); return set.size; }
function renderLetters() {
  const el = $('#letters');
  const present = [...new Set(S.plants.map(p => firstLetter(p.name)).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'he'));
  if (present.length < 2 || UI.smart) { el.innerHTML = ''; if (UI.letter && !present.includes(UI.letter)) UI.letter = ''; return; }

}
function filtered() {
  let list = S.plants.slice();
  if (UI.smart && UI.smart.ids) { const set = new Map(UI.smart.ids.map((id, i) => [id, i])); list = list.filter(p => set.has(p.id)).sort((a, b) => set.get(a.id) - set.get(b.id)); }
  if (UI.cat !== 'all') list = list.filter(p => (p.categoryIds || []).includes(UI.cat));
  if (UI.letter) list = list.filter(p => firstLetter(p.name) === UI.letter);
  for (const [fid, val] of Object.entries(UI.filters)) {
    if (val === '' || val == null) continue;
    if (fid === '__supplier') { list = list.filter(p => (pp(p.id).supplier || '') === val); continue; }
    if (fid === '__season') { list = list.filter(p => { const ss = seasonState(p); return ss && (val === 'all' || (val === 'plant' ? ss.plantNow : ss.availNow)); }); continue; }
    const f = S.fields.find(x => x.id === fid); if (!f) continue;
    list = list.filter(p => { const v = p.attrs && p.attrs[fid];
      if (f.type === 'bool') return val === 'yes' ? !!v : !v;
      return Array.isArray(v) ? v.includes(val) : v === val; });
  }
  const q = norm(UI.q); let fuzzy = false;
  if (q && !UI.smart) {
    const toks = q.split(' ');
    const scored = list.map(p => { const h = haystack(p); const nm = norm(p.name);
      const ok = toks.every(t => tokOk(h, t));
      return {p, ok, s: ok ? (nm.startsWith(q) ? 3 : nm.includes(q) ? 2 : 1) : 0, h}; });
    let hits = scored.filter(x => x.ok);
    if (!hits.length) {
      hits = scored.filter(x => { const words = x.h.split(' '); return toks.every(t => t.length < 3 ? x.h.includes(t) : tokOk(x.h, t) || words.some(wd => lev1(t, wd) || (wd.length > t.length && lev1(t, wd.slice(0, t.length))))); });
      fuzzy = hits.length > 0;
    }
    list = hits.sort((a, b) => b.s - a.s).map(x => x.p);
    if (UI.sort === 'name') return {list, fuzzy};
  }
  if (!UI.smart || UI.sort !== 'name') {
    if (UI.sort === 'name') list.sort((a, b) => String(a.name).localeCompare(String(b.name), 'he'));
    if (UI.sort === 'priceAsc') list.sort((a, b) => (minPrice(a) ?? Infinity) - (minPrice(b) ?? Infinity));
    if (UI.sort === 'priceDesc') list.sort((a, b) => (minPrice(b) ?? -1) - (minPrice(a) ?? -1));
    if (UI.sort === 'new') list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  }
  return {list, fuzzy};
}

/* ---------- images ---------- */
async function toJpeg(file, max = 1800, force = false) {
  if (!force && (!/^image\/(jpeg|png|webp)$/.test(file.type) || file.size < 900 * 1024)) return file;
  try {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const cv = document.createElement('canvas'); cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
    cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
    const b = await new Promise(r => cv.toBlob(r, 'image/jpeg', .85));
    return b && (force || b.size < file.size) ? b : file;
  } catch { return file; }
}
function uploadErr(e) {
  return e && e.code === 'too_large' ? 'התמונה גדולה מדי (עד 20MB)' : e && e.code === 'unsupported_type' ? 'סוג הקובץ לא נתמך. השתמשו ב-JPG, PNG או WEBP' : e && e.code === 'quota_or_state' ? 'נגמר מקום האחסון לתמונות' : 'העלאה נכשלה. נסו שוב';
}

  let pg = newPage();
  for (const b of blocks) { pg.appendChild(b); if (pg.scrollHeight > H && pg.children.length > 1) { pg.removeChild(b); pg = newPage(); pg.appendChild(b); } }
  await Promise.all($$('img', host).map(im => im.complete ? 0 : new Promise(r => { im.onload = im.onerror = r; })));
  try { await document.fonts.ready; } catch {}
  const {jsPDF} = window.jspdf; const pdf = new jsPDF({unit: 'pt', format: 'a4'});
  const pages = [...host.children];
  for (let k = 0; k < pages.length; k++) {
    progress(`יוצר עמוד ${k + 1} מתוך ${pages.length}…`);
    const cv = await window.html2canvas(pages[k], {scale: 2, backgroundColor: '#ffffff', logging: false, useCORS: true});
    if (k) pdf.addPage();
    pdf.addImage(cv.toDataURL('image/jpeg', .9), 'JPEG', 0, 0, 595.28, 841.89);
  }
  host.remove();
  progress('שומר…');
  const name = `${withPrices ? 'הצעת מחיר' : 'רשימת צמחים'} - ${(c.name || 'לקוח').replace(/[\\/:*?"<>|]/g, '')}.pdf`;
  await downloads.save({filename: name, data: pdf.output('blob')});
  toast('הקובץ נשמר');
}

/* ---------- price of one plant (edited from the price list) ---------- */
function openPlantPricing(id) {
  const p = plantById(id); if (!p) return;

  openDlg(`<div class="dlg-head"><h2 id="dlgTitle">מחיר: ${esc(p.name)}</h2>${X}</div>
    <form class="dlg-body" id="ppForm" novalidate>
      <div class="form-grid">

      ${S.sizes.length ? `<div class="tscroll"><table class="t"><thead><tr><th>זמין</th><th>גודל</th><th>קנייה מהמחירון</th><th>קנייה לצמח</th><th>מחיר קבוע</th><th>מחיר ללקוח</th></tr></thead><tbody>
        ${S.sizes.slice().sort(byOrder).map(z => { const base = catCost(p.categoryIds, z.id); return `<tr>
          <td><input type="checkbox" data-szav="${esc(z.id)}" aria-label="זמין ב${esc(z.label)}" ${sizeIds.includes(z.id) ? 'checked' : ''} style="width:20px;height:20px;accent-color:var(--leaf)"></td>
          <td>${esc(z.label)}</td><td>${base != null ? ILS(base) : '<span class="muted">—</span>'}</td>
          <td><input class="inp" style="width:100px;direction:ltr" type="number" min="0" step="any" inputmode="decimal" data-szc="${esc(z.id)}" value="${esc(pr.cost[z.id] ?? '')}" aria-label="מחיר קנייה ל${esc(z.label)}"></td>
          <td><input class="inp" style="width:100px;direction:ltr" type="number" min="0" step="any" inputmode="decimal" data-szs="${esc(z.id)}" value="${esc(pr.sale[z.id] ?? '')}" aria-label="מחיר קבוע ל${esc(z.label)}"></td>
          <td data-calc="${esc(z.id)}"></td></tr>`; }).join('')}</tbody></table></div>` : '<p class="hint">אין גדלים. הוסיפו אותם במסך המחירון.</p>'}
    </form>
    <div class="dlg-foot"><button class="btn primary" id="ppSave">שמירה</button><button class="btn" data-close>ביטול</button></div>`);
  const form = $('#ppForm');
  const read = () => {
    pr.supplier = $('#pp-sup').value.trim(); const mk = $('#pp-mk').value; pr.markup = mk === '' ? null : Number(mk);
    pr.cost = {}; pr.sale = {};
    $$('[data-szc]', form).forEach(x => { if (x.value !== '') pr.cost[x.dataset.szc] = Number(x.value); });
    $$('[data-szs]', form).forEach(x => { if (x.value !== '') pr.sale[x.dataset.szs] = Number(x.value); });
    return $$('[data-szav]', form).filter(x => x.checked).map(x => x.dataset.szav);
  };
  const calc = () => { read(); S.sizes.forEach(z => { const c = $(`[data-calc="${CSS.escape(z.id)}"]`, form); if (!c) return; const inf = priceInfo(p, z.id, pr); c.innerHTML = inf.price != null ? `<b>${ILS(inf.price)}</b>${inf.sale == null ? `<span class="calc">+${inf.markup}%</span>` : ''}` : '<span class="muted">—</span>'; }); };
  calc(); form.addEventListener('input', calc);
  $('#ppSave').onclick = async () => {
    const av = read(); $('#ppSave').disabled = true;
    try {
      await w('plantPricing/' + id, r => r.set({...pr, cost: pr.cost, sale: pr.sale, plantMonths: pr.plantMonths || [], availMonths: pr.availMonths || []}));

      dlg.close(); toast('המחיר נשמר');
    } catch { $('#ppSave').disabled = false; }
  };
}

/* ---------- shared: validate Claude's attribute answers against the field definitions ---------- */
function cleanAttrs(raw) {
  const out = {};
  for (const f of S.fields) {
    const v = raw && raw[f.id]; if (v == null || v === '') continue;
    if (f.type === 'multi') { const a = (Array.isArray(v) ? v : [v]).map(String).filter(x => (f.options || []).includes(x)); if (a.length) out[f.id] = a; }
    else if (f.type === 'select') { if ((f.options || []).includes(String(v))) out[f.id] = String(v); }
    else if (f.type === 'bool') { if (v === true) out[f.id] = true; }
    else if (f.type === 'number') { const n = parseFloat(v); if (!isNaN(n)) out[f.id] = n; }
    else out[f.id] = String(v).trim();
  }
  return out;
}
const catIdsFromNames = names => (Array.isArray(names) ? names : []).map(n => S.categories.find(c => c.name === n)).filter(Boolean).map(c => c.id);
const fieldSchema = () => S.fields.map(f => `- "${f.id}": ${f.label}${f.unit ? ' ביחידות ' + f.unit : ''}; סוג ${f.type}${f.options && f.options.length ? '; ערכים מותרים בלבד: ' + f.options.join(' | ') : ''}`).join('\n');

        <td>${esc(r.confidence || '')}</td></tr>`).join('')}</tbody></table></div>` : '';
    const n = results.filter(r => r.sel).length;
    $('#bulkSave').disabled = !n; $('#bulkSave').textContent = n ? `שמירת ${n} צמחים` : 'שמירת הצמחים המסומנים';
  };
  $('#bulkOut').addEventListener('change', e => { const b = e.target.closest('[data-bk]'); if (b) { results[+b.dataset.bk].sel = b.checked; render(); } });
  $('#bulkGo').onclick = async () => {
    const existing = new Set(S.plants.flatMap(p => [norm(p.name), norm(p.otherNames)]).filter(Boolean));
    const names = [...new Set($('#bulkNames').value.split(/\n|,/).map(s => s.trim()).filter(Boolean))];
    if (!names.length) { $('#bulkNames').focus(); return; }
    const dup = names.filter(n => existing.has(norm(n)));

    $('#bulkGo').disabled = true; abort = new AbortController();
    const st = $('#bulkState');
    for (let i = 0; i < todo.length; i += 6) {
      const chunk = todo.slice(i, i + 6);
      st.innerHTML = `<span class="spin" aria-hidden="true"></span> ממלא ${Math.min(i + 6, todo.length)} מתוך ${todo.length}…`;
      try {
        const r = await sample.json(`אתה אגרונום ומומחה משתלות בישראל, וממלא קטלוג צמחים לגנן מקצועי.

השתמש במינוח של משתלת מלצר: שם עברי מלא, שם לטיני מדעי, משפחה בפורמט "משפחת X - Latinaceae".
שדות המאפיינים:
${fieldSchema()}
לסוג select ערך אחד מהרשימה, לסוג multi מערך מהרשימה, לסוג bool רק true כשנכון, לסוג number מספר (לגובה: הגובה המרבי במטרים).
השמות: ${JSON.stringify(chunk)}
החזר JSON בלבד:
{"plants":[{"input":"השם כפי שנכתב","found":true,"confidence":"גבוהה|בינונית|נמוכה","fullName":"","latin":"","otherNames":"","notes":"2 משפטים על גידול בישראל","attrs":{},"categories":["מתוך: ${S.categories.map(c => c.name).join(', ')}"],"seasonal":false,"plantMonths":[],"availMonths":[]}]}`, {modelTier: 'default', signal: abort.signal});
        for (const name of chunk) {
          const x = (r.plants || []).find(p => norm(p.input) === norm(name)) || {};
          const ok = !!(x.found && x.fullName);
          results.push({input: name, ok, sel: ok && x.confidence !== 'נמוכה', fullName: String(x.fullName || ''), latin: String(x.latin || ''), otherNames: String(x.otherNames || ''), notes: String(x.notes || ''),

        }
      } catch (e) {
        if (e && e.name === 'AbortError') return;

    $('#bulkGo').disabled = false;
  };
  $('#bulkSave').onclick = async () => {
    const sel = results.filter(r => r.sel); if (!sel.length) return;

/* ---------- full-screen photo viewer with zoom ---------- */
const viewer = $('#viewer');
function openViewer(ids, start = 0, title = '') {
  if (!ids || !ids.length) return;
  let i = start, scale = 1, tx = 0, ty = 0;
  const back = document.activeElement;
  viewer.innerHTML = `<div class="vw-top"><span class="vw-title">${esc(title)} <span class="vw-count" aria-live="polite"></span></span>
      <button class="vw-btn" data-z="out" aria-label="הקטנה">−</button><button class="vw-btn" data-z="in" aria-label="הגדלה">+</button>
      <button class="vw-btn" data-z="close" aria-label="סגירה">✕</button></div>
    <div class="vw-stage"><img class="vw-img" alt="" draggable="false"></div>
    ${ids.length > 1 ? '<button class="vw-nav prev" aria-label="התמונה הקודמת">›</button><button class="vw-nav next" aria-label="התמונה הבאה">‹</button>' : ''}
    <p class="vw-hint">צביטה או גלגלת להגדלה · לחיצה כפולה להגדלה מהירה · גרירה להזזה</p>`;
  const img = $('.vw-img', viewer), stage = $('.vw-stage', viewer);
  const apply = () => { img.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`; stage.style.cursor = scale > 1 ? 'grab' : 'zoom-in'; };
  const zoom = (f, cx, cy) => {
    const r = stage.getBoundingClientRect(); const ns = Math.min(6, Math.max(1, scale * f));
    if (cx != null) { const ox = cx - r.left - r.width / 2, oy = cy - r.top - r.height / 2; tx = ox - (ox - tx) * ns / scale; ty = oy - (oy - ty) * ns / scale; }
    scale = ns; if (scale === 1) { tx = 0; ty = 0; } apply();
  };
  const go = k => { i = (k + ids.length) % ids.length; scale = 1; tx = ty = 0; img.src = blob(ids[i]); img.alt = `${title}, תמונה ${i + 1} מתוך ${ids.length}`; $('.vw-count', viewer).textContent = ids.length > 1 ? `${i + 1} / ${ids.length}` : ''; apply(); };
  viewer.onclick = e => {
    const z = e.target.closest('[data-z]'); if (z) { if (z.dataset.z === 'close') viewer.close(); else zoom(z.dataset.z === 'in' ? 1.5 : 1 / 1.5); return; }
    if (e.target.closest('.vw-nav.prev')) go(i - 1); else if (e.target.closest('.vw-nav.next')) go(i + 1);
  };
  stage.ondblclick = e => { if (scale > 1) { scale = 1; tx = ty = 0; apply(); } else zoom(2.5, e.clientX, e.clientY); };
  stage.onwheel = e => { e.preventDefault(); zoom(e.deltaY < 0 ? 1.2 : 1 / 1.2, e.clientX, e.clientY); };
  const pts = new Map(); let pinch0 = 0, scale0 = 1, last = null, swipeX = null;
  stage.onpointerdown = e => { stage.setPointerCapture(e.pointerId); pts.set(e.pointerId, {x: e.clientX, y: e.clientY}); last = {x: e.clientX, y: e.clientY}; swipeX = scale === 1 && pts.size === 1 ? e.clientX : null;
    if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch0 = Math.hypot(a.x - b.x, a.y - b.y); scale0 = scale; } };
  stage.onpointermove = e => { if (!pts.has(e.pointerId)) return; pts.set(e.pointerId, {x: e.clientX, y: e.clientY});
    if (pts.size === 2) { const [a, b] = [...pts.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y); if (pinch0) { scale = Math.min(6, Math.max(1, scale0 * d / pinch0)); if (scale === 1) { tx = ty = 0; } apply(); } }
    else if (scale > 1 && last) { tx += e.clientX - last.x; ty += e.clientY - last.y; apply(); }
    last = {x: e.clientX, y: e.clientY}; };
  stage.onpointerup = stage.onpointercancel = e => { pts.delete(e.pointerId); if (pts.size < 2) pinch0 = 0;
    if (swipeX != null && ids.length > 1) { const dx = e.clientX - swipeX; if (Math.abs(dx) > 60) go(dx < 0 ? i - 1 : i + 1); } swipeX = null; last = null; };
  viewer.onkeydown = e => { if (e.key === 'ArrowLeft') go(i + 1); else if (e.key === 'ArrowRight') go(i - 1); else if (e.key === '+' || e.key === '=') zoom(1.5); else if (e.key === '-') zoom(1 / 1.5); };
  viewer.onclose = () => { viewer.innerHTML = ''; if (back && back.focus) back.focus(); };
  go(start); viewer.showModal(); $('[data-z="close"]', viewer).focus();
}

  let best = 0;
  for (const f of fields) { if (f.startsWith(q)) best = Math.max(best, 4); else if (f.split(' ').some(wd => wd.startsWith(q))) best = Math.max(best, 3); else if (f.includes(q)) best = Math.max(best, 2); }
  if (!best && q.length >= 3 && fields.some(f => f.split(' ').some(wd => lev1(q, wd.slice(0, q.length + 1)) || lev1(q, wd)))) best = 1;
  return best;
}

/* ---------- plant-by-plant presentation ---------- */
/* similar plants: same category and matching attributes score higher */
function similarPlants(p, n = 8) {
  const val = (q, f) => { const v = q.attrs && q.attrs[f.id]; return v == null || v === '' ? [] : (Array.isArray(v) ? v : [v]).map(String); };
  const weights = {sun: 3, water: 2, lifeForm: 3, foliage: 1, bloomColor: 1, uses: 1, coast: 1};
  return S.plants.filter(q => q.id !== p.id).map(q => {
    let sc = (q.categoryIds || []).filter(c => (p.categoryIds || []).includes(c)).length * 4;
    S.fields.filter(f => ['select', 'multi', 'bool'].includes(f.type)).forEach(f => { const a = val(p, f), b = val(q, f); if (a.length && b.length && a.some(x => b.includes(x))) sc += weights[f.id] || 0.5; });
    const hp = num(p.attrs && p.attrs.height), hq = num(q.attrs && q.attrs.height); if (hp && hq && Math.abs(hp - hq) / Math.max(hp, hq) < 0.4) sc += 2;
    return {q, sc};
  }).filter(x => x.sc > 0).sort((a, b) => b.sc - a.sc).slice(0, n).map(x => x.q);
}
function swapPanel(p, it) {

  return `<div class="swap-panel"><b>צמחים דומים מהקטלוג</b>${sims.length ? `<div class="swap-list">${sims.map(q => { const mp = minPrice(q);

}
function presentItems(c) { return (c.items || []).map((it, k) => ({it, k, p: plantById(it.plantId)})).filter(x => x.p); }
function renderPresent() {
  const root = $('#presentRoot');

  const varObj = (p.varieties || []).find(v => v.name === it.variety);
  root.innerHTML = UI.overview ? `<div class="present" role="dialog" aria-modal="true" aria-labelledby="prTitle"><div class="wrap">
      <div class="present-head"><h2 id="prTitle">כל הצמחים עבור ${esc(c.name || '')}</h2><button class="btn" id="prBack">חזרה למצגת</button><button class="btn primary" id="prClose">סגירה</button></div>
      <div class="grid" style="padding-bottom:40px">${list.map((x, n) => `<article class="card"><button class="open" data-slide="${n}" aria-label="${n + 1}. ${esc(x.p.name)}"><div class="thumb">${(x.p.images || []).length ? `<img src="${esc(blob(x.p.images[0]))}" alt="">` : placeholder(x.p)}<span class="imgcount">${n + 1}</span></div>
        <div class="tag"><h3>${esc(x.p.name)}</h3>${x.it.variety ? `<div class="muted">זן: ${esc(x.it.variety)}</div>` : ''}<div class="price-from">${esc((sizeById(x.it.sizeId) || {}).label || '')} × ${x.it.qty || 1}</div></div></button></article>`).join('')}</div>
      ${UI.showPrices ? `<p class="total" style="padding-bottom:40px">סה״כ ${ILS(clientTotal(c))}</p>` : ''}</div></div>`
  : `<div class="present slides" role="dialog" aria-modal="true" aria-labelledby="prTitle" aria-roledescription="מצגת">
    <div class="wrap slide-top"><h2 id="prTitle" class="sr">הצמחים שנבחרו עבור ${esc(c.name || '')}</h2>

        ${imgs.length > 1 ? `<div class="thumbs" role="group" aria-label="תמונות">${imgs.map((im, k) => `<button data-simg="${k}" aria-label="תמונה ${k + 1}" aria-current="${k === (UI.slideImg || 0)}"><img src="${esc(blob(im))}" alt=""></button>`).join('')}</div>` : ''}
      </div>
      <div class="slide-info">
        ${it.area && (c.areas || []).includes(it.area) ? `<span class="cat">${esc(it.area)}</span>` : ''}
        <h3 class="slide-name">${esc(p.name)}</h3>
        ${p.latin ? `<div class="latin" style="font-size:1.15em">${esc(p.latin)}</div>` : ''}
        ${it.variety ? `<div class="slide-var">זן: <b>${esc(it.variety)}</b>${varObj && varObj.desc ? ' · ' + esc(varObj.desc) : ''}</div>` : ''}
        <div class="slide-qty">${esc(s ? s.label : '')} × ${it.qty || 1}${UI.showPrices && pr != null ? ` · <b>${ILS(pr * (it.qty || 1))}</b>` : ''}</div>
        <div class="slide-edit">
          <div class="field"><label for="slSize">גודל</label><select class="inp" id="slSize" style="min-width:150px">${(sizesFor(p).length ? sizesFor(p) : S.sizes.map(z => ({size: z, price: null}))).map(x => `<option value="${esc(x.size.id)}" ${x.size.id === it.sizeId ? 'selected' : ''}>${esc(x.size.label)}${UI.showPrices && x.price != null ? ' · ' + ILS(x.price) : ''}</option>`).join('')}</select></div>
          <div class="field"><span style="font-weight:700;font-size:.92em">כמות</span><span class="qty"><button class="btn sm" id="slQm" aria-label="הפחתת כמות">−</button><input class="inp" id="slQ" type="number" min="1" value="${esc(it.qty || 1)}" aria-label="כמות"><button class="btn sm" id="slQp" aria-label="הוספת כמות">+</button></span></div>
          ${(p.varieties || []).length ? `<div class="field"><label for="slVar">זן</label><select class="inp" id="slVar"><option value="">—</option>${p.varieties.map(v => `<option ${v.name === it.variety ? 'selected' : ''}>${esc(v.name)}</option>`).join('')}</select></div>` : ''}
          <button class="btn clay" id="slSwap" aria-expanded="${!!UI.swapOpen}">החלפה בצמח דומה</button>
        </div>
        ${UI.swapOpen ? swapPanel(p, it) : ''}
        ${attrs ? `<dl class="attrs">${attrs}</dl>` : ''}
        ${p.notes ? `<p style="margin:0;white-space:pre-wrap">${esc(p.notes)}</p>` : ''}
      </div>
    </div>
    <div class="slide-foot"><div class="wrap" style="display:flex;gap:10px;align-items:center">
      <button class="btn slide-nav" id="slPrev" ${UI.slide === 0 ? 'disabled' : ''} aria-label="הצמח הקודם">→ הקודם</button>
      <div class="slide-strip" role="group" aria-label="כל הצמחים לפי סדר">${list.map((x, n) => `<button data-slide="${n}" aria-label="${n + 1}. ${esc(x.p.name)}" aria-current="${n === UI.slide}">${(x.p.images || []).length ? `<img src="${esc(blob(x.p.images[0]))}" alt="">` : `<span>${n + 1}</span>`}</button>`).join('')}</div>
      <button class="btn primary slide-nav" id="slNext" ${UI.slide === list.length - 1 ? 'disabled' : ''} aria-label="הצמח הבא">הבא ←</button>

  </div>`;
  const goSlide = n => { UI.slide = Math.max(0, Math.min(list.length - 1, n)); UI.slideImg = 0; UI.overview = false; UI.swapOpen = false; renderPresent(); };
  $('#prClose').onclick = () => { UI.present = false; UI.overview = false; renderPresent(); };
  $$('[data-slide]', root).forEach(b => b.onclick = () => goSlide(+b.dataset.slide));
  if (UI.overview) { $('#prBack').onclick = () => { UI.overview = false; renderPresent(); }; if (!hadFocus) $('#prClose').focus(); return; }
  $('#prAll').onclick = () => { UI.overview = true; renderPresent(); };
  const k = list[UI.slide].k;
  const saveItem = patch => { const a = (c.items || []).map(x => ({...x})); Object.assign(a[k], patch); return wq('clients/' + c.id, r => r.update({items: a, updatedAt: Date.now()})); };
  $('#slSize').onchange = e => saveItem({sizeId: e.target.value});
  $('#slQ').onchange = e => saveItem({qty: Math.max(1, Math.round(+e.target.value || 1))});
  $('#slQm').onclick = () => saveItem({qty: Math.max(1, (it.qty || 1) - 1)});
  $('#slQp').onclick = () => saveItem({qty: (it.qty || 1) + 1});
  const sv = $('#slVar'); if (sv) sv.onchange = e => saveItem({variety: e.target.value});
  $('#slSwap').onclick = () => { UI.swapOpen = !UI.swapOpen; renderPresent(); };
  $$('[data-swap]', root).forEach(b => b.onclick = async () => {
    const np = plantById(b.dataset.swap); if (!np) return;
    const ns = sizesFor(np); const keep = ns.find(x => x.size.id === it.sizeId) || ns.find(x => x.price != null) || ns[0];
    UI.swapOpen = false; UI.slideImg = 0;
    await saveItem({plantId: np.id, sizeId: keep ? keep.size.id : it.sizeId, variety: ''});

  $('#prPrices').onchange = e => { UI.showPrices = e.target.checked; renderPresent(); };
  $$('[data-simg]', root).forEach(b => b.onclick = () => { UI.slideImg = +b.dataset.simg; renderPresent(); });
  $('#slideZoom').onclick = () => openViewer(imgs, UI.slideImg || 0, p.name);

  body.onpointerdown = e => { sx = e.clientX; }; body.onpointerup = e => { if (sx == null) return; const dx = e.clientX - sx; sx = null; if (Math.abs(dx) > 70) goSlide(UI.slide + (dx > 0 ? 1 : -1)); };

  const f = focusId && document.getElementById(focusId); if (f && !f.disabled) f.focus(); else if (!hadFocus) $('#slNext').focus();

document.addEventListener('keydown', e => {
  if (!UI.present || dlg.open || viewer.open || UI.overview) return;
  if (/INPUT|SELECT/.test((document.activeElement || {}).tagName || '') && document.activeElement.type !== 'checkbox') return;
  if (e.key === 'ArrowLeft') { e.preventDefault(); const n = $('#slNext'); if (n && !n.disabled) n.click(); }
  if (e.key === 'ArrowRight') { e.preventDefault(); const pv = $('#slPrev'); if (pv && !pv.disabled) pv.click(); }
});

/* ---------- full backup (JSON with photos) and restore ---------- */
const BACKUP_COLLS = ['categories', 'fields', 'sizes', 'plants', 'plantPricing', 'clients'];
const stripId = o => { const {id, ...rest} = o; return rest; };
const blobToDataUrl = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); });
async function exportBackup(withImages, progress) {
  if (!downloads) throw {code: 'unavailable'};
  const docs = {};
  BACKUP_COLLS.forEach(c => { docs[c] = {}; S[c].forEach(d => { docs[c][d.id] = stripId(d); }); });
  docs.settings = {prices: S.pricing || {}}; docs.meta = {business: S.biz || {}};
  const images = {};
  if (withImages) {
    const ids = [...new Set([...S.plants.flatMap(p => p.images || []), S.biz.logoId].filter(Boolean))];
    let k = 0;
    for (const id of ids) {
      progress(`מכין תמונה ${++k} מתוך ${ids.length}…`);
      try { const b = await blobOfAsset(id); if (b) images[id] = await blobToDataUrl(b); } catch {}
    }
  }
  const d = new Date(); const stamp = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const json = JSON.stringify({app: 'plant-catalog', version: 1, exportedAt: d.toISOString(), docs, images});
  progress('שומר…');
  await downloads.save({filename: `גיבוי קטלוג ${stamp}.json`, data: new Blob([json], {type: 'application/json'})});
}
async function importBackup(file, progress) {
  const data = JSON.parse(await file.text());
  if (!data || data.app !== 'plant-catalog' || !data.docs) throw new Error('format');
  const idMap = {};
  const imgs = Object.entries(data.images || {});
  if (imgs.length && assets) {
    let k = 0;
    for (const [oldId, dataUrl] of imgs) {
      progress(`מעלה תמונה ${++k} מתוך ${imgs.length}…`);
      try { const b = await (await fetch(dataUrl)).blob(); const r = await assets.upload(b, {type: b.type || 'image/jpeg'}); idMap[oldId] = r.id; } catch (e) { console.warn('image', oldId, e); }
    }
  }
  const mapImg = id => idMap[id] || (imgs.length ? null : id);
  const all = [];
  for (const [c, byId] of Object.entries(data.docs)) for (const [id, d] of Object.entries(byId)) {
    const doc = JSON.parse(JSON.stringify(d));
    if (c === 'plants') doc.images = (doc.images || []).map(mapImg).filter(Boolean);
    if (c === 'meta' && id === 'business' && doc.logoId) doc.logoId = mapImg(doc.logoId);
    all.push([c, id, doc]);
  }
  let k = 0;
  for (const [c, id, doc] of all) { progress(`שומר ${++k} מתוך ${all.length}…`); await w(c + '/' + id, r => r.set(doc)); }
  return all.length;
}
function backupPanelHtml() {
  return `<div class="panel stack"><h3 style="font-size:1.3rem">גיבוי מלא</h3>
    <p class="hint" style="margin:0">קובץ אחד עם כל הנתונים (צמחים, מאפיינים, מחירון, לקוחות) וגם התמונות. משמש לגיבוי ולהעברת הקטלוג לאפליקציה אחרת. שחזור מקובץ מוסיף ומעדכן נתונים, ולא מוחק מה שכבר קיים.</p>
    <div class="checks"><label><input type="checkbox" id="bkImgs" checked>כולל תמונות</label></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="bkOut">הורדת גיבוי</button>${assets ? `<label class="btn" for="bkIn">שחזור מקובץ גיבוי</label><input type="file" id="bkIn" accept="application/json,.json" class="sr">` : ''}</div>
    <p class="hint" id="bkState" aria-live="polite" style="margin:0">${esc(UI.bkMsg || '')}</p></div>`;
}
function wireBackup(host) {
  const st = {set textContent(t) { UI.bkMsg = t; const e = $('#bkState'); if (e) e.textContent = t; }};
  $('#bkOut', host).onclick = async () => { const b = $('#bkOut', host); b.disabled = true;
    try { await exportBackup($('#bkImgs', host).checked, t => st.textContent = t); st.textContent = 'הגיבוי נשמר.'; }
    catch (e) { st.textContent = e && e.code === 'declined' ? 'ההורדה בוטלה.' : 'הגיבוי נכשל. נסו שוב.'; }
    b.disabled = false; };
  const inp = $('#bkIn', host);
  if (inp) inp.onchange = async () => { const f = inp.files[0]; inp.value = ''; if (!f) return;
    if (!await confirmBox('שחזור מגיבוי', `לייבא את "${f.name}"? נתונים עם אותו מזהה יוחלפו בנתונים מהקובץ.`, 'ייבוא')) return;
    try { const n = await importBackup(f, t => st.textContent = t); st.textContent = `יובאו ${n} פריטים.`; toast('השחזור הסתיים'); }
    catch (e) { st.textContent = e && e.message === 'format' ? 'הקובץ אינו קובץ גיבוי של הקטלוג.' : 'השחזור נכשל באמצע. אפשר להריץ אותו שוב.'; } };
}

/* ---------- boot ---------- */
const startView = (location.hash || '#catalog').slice(1);
loadCache();
show(startView); renderOffline();
(async () => {
  try { db = await claude.use('db'); } catch { db = null; }
  if (!db) { if (!S.ready.plants) S.noDb = true; renderView(true); return; }
  [user, assets, sample, downloads] = await Promise.all(['user', 'assets', 'sample', 'downloads'].map(n => claude.use(n).catch(() => null)));
  if (user) { try { canWrite = !!(await user.canEdit()); } catch { canWrite = false; } } else canWrite = !!assets;
  if (sample) { try { imgLimits = (await sample.limits()).images || null; } catch { imgLimits = null; } }
  $('#photoBtn').hidden = !imgLimits; $('#smartBtn').hidden = !sample;
  const sub = (name, post) => db.collection(name).onSnapshot(snap => {
    S[name] = snap.docs.map(d => ({id: d.id, ...d.data()})); if (post) S[name].sort(post); S.ready[name] = true; saveCache(); scheduleRender();
  }, err => console.warn(name, err));
  sub('categories', byOrder); sub('fields', byOrder); sub('sizes', byOrder); sub('plants');
  db.doc('meta/business').onSnapshot(s => { S.biz = s.exists ? s.data() : {}; scheduleRender(); }, () => {});
  if (canWrite) {
    sub('clients'); sub('plantPricing');
    db.doc('settings/prices').onSnapshot(s => { S.pricing = s.exists ? s.data() : {}; scheduleRender(); }, () => {});
  }
  show(UI.view === 'catalog' ? startView : UI.view);
})();
})();
